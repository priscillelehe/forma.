<!DOCTYPE html>
<html lang="en" data-theme="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORMA — Training Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=dusk]{--bg:#0F1117;--surface:#171A23;--card:#20242F;--line:#2A2F3C;--line2:#383E4E;--lime:#9BE3B4;--lime-ink:#0F1117;--violet:#B7A9F7;--cyan:#86C9F0;--blue:#8AA8F8;--mint:#86DCCB;--amber:#F2C27E;--rose:#F4A0B5;--pink:#E8A9DD;--text:#F2F3F7;--muted:#A3A9B9;--faint:#6F7689;--r:18px;--shadow:0 12px 32px -14px rgba(0,0,0,.6)}
[data-theme=midnight]{--bg:#0B1020;--surface:#151D30;--card:#1D2940;--line:#26334F;--line2:#33415f;--lime:#B6F36A;--lime-ink:#0B1020;--violet:#8B7CF6;--cyan:#48C9D8;--blue:#5BA8F5;--mint:#7FE0C0;--amber:#F5B95F;--rose:#F28FAD;--pink:#E6A1F0;--text:#F6F8FC;--muted:#9BA9BF;--faint:#6B7891}
[data-theme=rose]{--bg:#140F15;--surface:#1D1620;--card:#271E2B;--line:#33283A;--line2:#45364C;--lime:#F5A9C4;--lime-ink:#1D1118;--violet:#C9B3F5;--cyan:#F6C6A4;--blue:#B9A6F0;--mint:#E8B7D4;--amber:#F3CB8F;--rose:#FF8FA8;--pink:#F0A6E0;--text:#F8F1F5;--muted:#B9A8B5;--faint:#7E6E7C}
[data-theme=ocean]{--bg:#08141A;--surface:#0F1E26;--card:#162A34;--line:#1F3642;--line2:#2B4756;--lime:#6FE0CF;--lime-ink:#06161B;--violet:#9DB4FF;--cyan:#7CCFF5;--blue:#86A9FF;--mint:#9BE8C8;--amber:#F5CF88;--rose:#F7A1A8;--pink:#D8A8F0;--text:#EEF6F8;--muted:#9AB2BC;--faint:#62808C}
[data-theme=sage]{--bg:#F7F1E4;--surface:#FFFCF5;--card:#F2EADA;--line:#E7DDC9;--line2:#D6C9B1;--lime:#7FA383;--lime-ink:#FFFFFF;--violet:#5E8FA8;--cyan:#3F8FA6;--blue:#4F7DB0;--mint:#6FA88A;--amber:#C08A2E;--rose:#C7646E;--pink:#B06C9C;--text:#25291F;--muted:#6D6E60;--faint:#9C9886;--shadow:0 14px 30px -20px rgba(80,65,35,.35)}
[data-theme=light]{--bg:#F6F4F1;--surface:#FFFFFF;--card:#F1EEEA;--line:#E5E0DA;--line2:#D3CCC4;--lime:#3E9B6E;--lime-ink:#FFFFFF;--violet:#7A63D8;--cyan:#2C8DB8;--blue:#4D6FD6;--mint:#2A9C85;--amber:#B97A16;--rose:#CC4F70;--pink:#B04FA6;--text:#1C1B22;--muted:#6B6672;--faint:#9A94A0;--shadow:0 12px 30px -18px rgba(60,40,30,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.num,.brand{font-family:"Space Grotesk",Manrope,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg));display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:21px;letter-spacing:.22em;display:flex;align-items:center;gap:11px;padding:2px 10px 20px}
.brand i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--lime),var(--cyan),var(--violet),var(--lime));box-shadow:0 0 18px -6px var(--lime)}
.swatch{display:inline-flex;gap:3px;margin-right:6px}.swatch i{width:10px;height:10px;border-radius:50%}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;width:100%}.themes button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line2);cursor:pointer;font-weight:700;font-size:13px}.themes button.on{outline:2px solid var(--lime);outline-offset:1px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;transition:.15s}
.nav a:hover{color:var(--text);background:color-mix(in srgb,var(--card) 60%,transparent)}
.nav a.on{background:var(--card);color:var(--text)}
.nav a.on svg{color:var(--lime)}
.side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok b{background:var(--lime)}.sync.warn b{background:var(--amber)}
main{padding:26px clamp(14px,3vw,40px) 130px;max-width:1320px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.el{background:var(--card)}
.card h2{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .hd h2{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.today-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}.b{font-weight:700}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);color:var(--text);padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.vio{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:32px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:16px;border-radius:14px}
.btn.icon{padding:0;width:36px;min-height:36px}
.btn.danger{color:var(--rose)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--lime) 16%,transparent);border-color:color-mix(in srgb,var(--lime) 45%,transparent);color:var(--lime)}
.chip.v{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent)}
.chip.c{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.chip.a{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.chip.r{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 45%,transparent)}
button.chip{cursor:pointer}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 var(--line2)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--lime)}
input[type=range]{padding:0;accent-color:var(--lime);background:transparent;border:0}
.tick{width:30px;height:30px;border-radius:10px;border:2px solid var(--line2);background:transparent;display:inline-grid;place-items:center;cursor:pointer;flex:none;color:transparent;transition:.15s}
.tick.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.tick svg{width:16px;height:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .num{font-size:28px;font-weight:700}
.note{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--cyan) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:color-mix(in srgb,var(--amber) 9%,var(--surface));border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.note.vio{background:color-mix(in srgb,var(--violet) 10%,var(--surface));border-color:color-mix(in srgb,var(--violet) 35%,transparent)}
.note svg{margin-top:1px}
/* hero */
.hero{position:relative;overflow:hidden;padding:24px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--violet) 16%,transparent),transparent 55%),radial-gradient(90% 120% at 0% 100%,color-mix(in srgb,var(--lime) 10%,transparent),transparent 60%),var(--surface)}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;text-align:center}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
/* timeline */
.tl{position:relative;padding-left:4px}
.tl .ev{display:grid;grid-template-columns:52px 14px 1fr auto;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-radius:12px}
.tl .ev:hover .t1{color:var(--text)}
.tl .ev .time{font-family:"Space Grotesk";font-size:13px;color:var(--muted);text-align:right}
.tl .ev .pin{width:12px;height:12px;border-radius:50%;border:3px solid var(--c,var(--muted));background:var(--surface);position:relative;z-index:1}
.tl .ev.done .pin{background:var(--c)}
.tl .ev.done .t1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.tl .ev.past:not(.done) .t1{color:var(--muted)}
.tl:before{content:"";position:absolute;left:72px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl .now{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;align-items:center;color:var(--lime);font-size:12px;font-weight:800}
.tl .now span:nth-child(2){width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 25%,transparent);position:relative;z-index:1}
.tl .now .ln{height:2px;background:linear-gradient(90deg,var(--lime),transparent)}
.t1{font-weight:700}.t2{font-size:12.5px;color:var(--muted)}
/* water */
.glass{width:84px;height:118px;border-radius:12px 12px 22px 22px;border:2px solid var(--line2);position:relative;overflow:hidden;flex:none;background:var(--bg)}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 85%,#fff),var(--cyan));transition:height .6s cubic-bezier(.2,.8,.2,1)}
.glass i:before{content:"";position:absolute;left:-20%;right:-20%;top:-6px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--cyan) 65%,#fff);opacity:.7}
.glass b{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--text) 35%,transparent)}
/* week */
.wk{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.wk .hdr{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 6px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.wk .hdr .d{font-family:"Space Grotesk";font-size:20px;color:var(--text);display:block}
.wk .hdr.tod .d{color:var(--lime)}
.wk .ad{border-bottom:1px solid var(--line);padding:4px;min-height:30px;display:flex;flex-direction:column;gap:3px}
.wk .ad span{font-size:11px;font-weight:700;padding:3px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .gut{position:relative;border-right:1px solid var(--line)}
.wk .gut span{position:absolute;right:6px;font-size:10.5px;color:var(--faint);transform:translateY(-6px)}
.wk .dc{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.wk .dc:last-child{border-right:0}
.wk .dc.tod{background-color:color-mix(in srgb,var(--lime) 3.5%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:9px;padding:4px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:grab;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:3px solid var(--c);color:var(--text);user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.blk:hover{box-shadow:0 0 0 1px var(--c)}
.blk b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{color:var(--muted)}
.blk.done{opacity:.6}.blk.done b:after{content:" ✓";color:var(--lime)}
.blk.skip{opacity:.4;text-decoration:line-through}
.blk.drag{cursor:grabbing;z-index:50;box-shadow:var(--shadow),0 0 0 2px var(--c);opacity:.95}
.blk.hl{box-shadow:0 0 0 2px var(--amber)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--lime);z-index:2}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--lime)}
.wkwrap{max-height:calc(100vh - 220px);overflow:auto;border-radius:16px}
/* workout logger */
.exc{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px}
.exc.cur{border-color:color-mix(in srgb,var(--lime) 55%,transparent)}
.sets{display:grid;grid-template-columns:28px minmax(56px,1fr) minmax(48px,.8fr) minmax(40px,.6fr) minmax(40px,.6fr) 34px 28px;gap:6px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:8px 6px;text-align:center;font-family:"Space Grotesk";font-size:15px}
.sets .n{font-family:"Space Grotesk";color:var(--muted);text-align:center}
.sets .rowdone input{border-color:color-mix(in srgb,var(--lime) 40%,transparent);background:color-mix(in srgb,var(--lime) 6%,var(--bg))}
.sug{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--violet) 10%,transparent);border:1px solid color-mix(in srgb,var(--violet) 28%,transparent);font-size:13px;margin-top:10px}
.sug b.num{font-size:16px;color:var(--text)}
.wbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:-6px 0 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line)}
.clock{font-family:"Space Grotesk";font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
/* floating */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 24px));pointer-events:none}
.dock>*{pointer-events:auto}
.rest{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.rest .bar{flex:1}
.rest .bar i{background:var(--cyan)}
.toast{background:var(--text);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:up .25s ease}
.toast button{background:transparent;border:0;color:var(--violet);font-weight:800;cursor:pointer;padding:4px}
.live{width:100%;display:flex;align-items:center;gap:10px;background:var(--lime);color:var(--lime-ink);border-radius:16px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);border:0;text-align:left}
@keyframes up{from{transform:translateY(10px);opacity:0}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:var(--shadow);animation:up .2s ease}
.modal.wide{width:min(820px,100%)}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--faint);font-size:11px;font-family:Manrope}
svg.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
.heat{display:grid;grid-template-columns:28px repeat(var(--w),1fr);gap:4px;font-size:10.5px;color:var(--faint)}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card);border:1px solid var(--line);display:block}
.mbar{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.mbar .track{height:12px;background:var(--bg);border-radius:6px;position:relative;border:1px solid var(--line);overflow:hidden}
.mbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.mbar .track u{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--lime) 12%,transparent);border-left:1px dashed color-mix(in srgb,var(--lime) 50%,transparent);border-right:1px dashed color-mix(in srgb,var(--lime) 50%,transparent)}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tblw{overflow-x:auto}
/* meals grid */
.mplan{display:grid;grid-template-columns:92px repeat(7,minmax(130px,1fr));gap:8px;min-width:1000px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px;font-size:12.5px;cursor:pointer;min-height:70px;display:flex;flex-direction:column;gap:4px;transition:.15s}
.mcell:hover{border-color:var(--line2);background:var(--card)}
.mcell.ov{border-color:color-mix(in srgb,var(--violet) 55%,transparent)}
.mcell.done{border-color:color-mix(in srgb,var(--lime) 45%,transparent)}
.mhd{font-size:12px;font-weight:800;color:var(--muted);padding:6px 4px}
.mhd.tod{color:var(--lime)}
/* rating */
.rate{display:flex;gap:6px}
.rate button{flex:1;min-width:34px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);font-weight:800;cursor:pointer;font-family:"Space Grotesk"}
.rate button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.crowd{display:flex;align-items:flex-end;gap:3px;height:54px}
.crowd i{flex:1;border-radius:4px 4px 2px 2px;background:var(--line2);min-height:3px}
.crowd i.sel{background:var(--cyan)}
.blur .hx{filter:blur(6px);transition:.2s}
.blur .hx:hover{filter:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;top:-20px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}
.prpop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bnav{display:none}
.skel{height:120px;border-radius:18px;background:linear-gradient(90deg,var(--surface),var(--card),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}.side{display:none}
 main{padding:18px 14px 150px}
 .g2,.g3,.g4,.today-grid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
 .bnav a.on{color:var(--lime)}
 .dock{bottom:76px}
 .modal{border-radius:20px;padding:18px}
 .scrim{align-items:end;padding:8px}
 .wkwrap{max-height:none}
 .sets{grid-template-columns:24px minmax(54px,1fr) minmax(44px,.8fr) minmax(36px,.55fr) minmax(36px,.55fr) 32px 24px;gap:5px}
 .kpi .num{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[data-theme=sage] .btn:not(.pri):not(.ghost):not(.vio):not(.danger){background:color-mix(in srgb,var(--cyan) 11%,var(--surface));border-color:color-mix(in srgb,var(--cyan) 32%,transparent);color:#2B6577}
[data-theme=sage] .btn:not(.pri):not(.ghost):not(.vio):not(.danger):hover{border-color:var(--cyan)}
[data-theme=sage] .btn.pri:hover{filter:brightness(.95)}
[data-theme=sage] .chip.on{color:#4E7653}
[data-theme=sage] .nav a.on svg,[data-theme=sage] .bnav a.on{color:#5E8763}
[data-theme=sage] .hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 55%),radial-gradient(90% 120% at 0% 100%,color-mix(in srgb,var(--lime) 16%,transparent),transparent 60%),var(--surface)}
[data-theme=sage] .seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(80,65,35,.12)}
[data-theme=sage] .toast{background:#2C3A33;color:#FFFCF5}
</style>

'use strict';
/* ============ utilities ============ */
const TZ='Europe/Paris';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(v,s)=>Math.round(v/s)*s;
const pad=n=>String(n).padStart(2,'0');
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const avg=a=>{const b=a.filter(v=>v!=null&&isFinite(v));return b.length?sum(b)/b.length:null};
const fmt1=v=>v==null?'—':(Math.round(v*10)/10).toString();
const _fp=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function parisNow(){const p={};for(const x of _fp.formatToParts(new Date()))p[x.type]=x.value;return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==='24'?'00':p.hour}:${p.minute}`}}
const today=()=>parisNow().date, nowHM=()=>parisNow().time;
const toD=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fromD=dt=>dt.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=toD(iso);d.setUTCDate(d.getUTCDate()+n);return fromD(d)};
const dow=iso=>(toD(iso).getUTCDay()+6)%7;
const mondayOf=iso=>addDays(iso,-dow(iso));
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const monthKey=iso=>iso.slice(0,7);
const hm2m=s=>{if(!s)return 0;const[h,m]=s.split(':').map(Number);return h*60+(m||0)};
const m2hm=m=>{m=clamp(Math.round(m),0,24*60-1);return pad(Math.floor(m/60))+':'+pad(m%60)};
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtD=iso=>`${DS[dow(iso)]} ${+iso.slice(8)} ${MONTHS[+iso.slice(5,7)-1].slice(0,3)}`;
const fmtLong=iso=>`${DAYS[dow(iso)]} ${+iso.slice(8)} ${MONTHS[+iso.slice(5,7)-1]}`;
const fmtShort=iso=>`${+iso.slice(8)} ${MONTHS[+iso.slice(5,7)-1].slice(0,3)}`;
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)};
const isoTs=ts=>{const p={};for(const x of _fp.formatToParts(new Date(ts)))p[x.type]=x.value;return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==='24'?'00':p.hour}:${p.minute}`}};

/* ============ categories ============ */
const CAT={workout:{l:'Workout',c:'var(--lime)'},mobility:{l:'Mobility',c:'var(--mint)'},football:{l:'Football',c:'var(--cyan)'},run:{l:'Run',c:'var(--blue)'},class:{l:'Class',c:'var(--violet)'},study:{l:'Study',c:'var(--amber)'},exam:{l:'Exam',c:'var(--rose)'},meal:{l:'Meal',c:'var(--faint)'},personal:{l:'Personal',c:'var(--pink)'},recovery:{l:'Recovery',c:'var(--mint)'},note:{l:'Note',c:'var(--muted)'}};

/* ============ exercise library ============ */
// m: muscles · e: equipment · t: c(ompound)/i(solation) · u: kg | hand (per hand) | assist | bw | time · a: alternatives
const EX={
smith_squat:{n:'Smith machine squat',m:['Quads','Glutes'],e:'Smith machine',t:'c',u:'kg',i:'Feet shoulder-width, slightly in front of the bar. Brace your core, unlock the bar and sit down between your hips until thighs are about parallel. Drive up through the mid-foot, knees tracking over toes. Control the descent (2–3 s).',a:['goblet_squat','leg_press','barbell_squat']},
smith_hip_thrust:{n:'Smith machine hip thrust',m:['Glutes','Hamstrings'],e:'Smith machine + bench',t:'c',u:'kg',i:'Upper back on the bench edge, bar padded across the hip crease, feet flat about hip-width. Tuck chin, drive hips up until torso is parallel to the floor, squeeze glutes for 1 s at the top, lower under control. Ribs down — avoid arching your lower back.',a:['hip_thrust_machine','glute_bridge','cable_kickback']},
leg_press:{n:'Leg press',m:['Quads','Glutes'],e:'Leg press machine',t:'c',u:'kg',i:'Feet mid-platform, shoulder-width. Lower until knees reach ~90° without your lower back peeling off the pad. Press through the whole foot, don\'t lock the knees hard at the top.',a:['smith_squat','goblet_squat','db_bulgarian']},
db_bulgarian:{n:'Dumbbell Bulgarian split squat',m:['Quads','Glutes'],e:'Dumbbells + bench',t:'c',u:'hand',side:1,i:'Rear foot laces-down on a bench, front foot far enough forward that the knee stays roughly over the mid-foot. Lower straight down, slight forward lean for more glute. Complete all reps on one leg, then switch.',a:['db_reverse_lunge','smith_split_squat','leg_press']},
leg_ext:{n:'Leg extension',m:['Quads'],e:'Leg extension machine',t:'i',u:'kg',i:'Knee joint lined up with the machine pivot, pad just above the ankles. Extend fully, pause and squeeze for 1 s, lower slowly (3 s).',a:['goblet_squat','leg_press']},
standing_calf:{n:'Standing calf raise',m:['Calves'],e:'Calf machine / Smith + step',t:'i',u:'kg',i:'Balls of the feet on the edge, heels hanging. Rise as high as possible, pause 1 s, then lower into a full stretch for 1–2 s.',a:['seated_calf']},
hanging_knee:{n:'Hanging knee raise',m:['Core'],e:'Pull-up bar / captain\'s chair',t:'i',u:'bw',i:'Hang (or use the captain\'s chair), brace, curl your pelvis up and bring knees towards your chest. Lower slowly without swinging.',a:['reverse_crunch','dead_bug']},
reverse_crunch:{n:'Reverse crunch',m:['Core'],e:'Mat',t:'i',u:'bw',i:'Lie on your back, knees bent at 90°. Curl hips off the floor towards your ribs using your abs, then lower slowly. Keep it controlled — no momentum.',a:['hanging_knee','dead_bug']},
side_plank:{n:'Side plank',m:['Core'],e:'Mat',t:'i',u:'time',side:1,i:'Elbow under shoulder, body in a straight line from head to feet, hips lifted. Breathe steadily. Hold for the target time each side.',a:['pallof']},
assisted_pullup:{n:'Assisted pull-up',m:['Back','Biceps'],e:'Assisted pull-up machine',t:'c',u:'assist',i:'Weight = assistance (lower assistance = harder). Grip slightly wider than shoulders, start from a dead hang, pull your chest towards the bar driving elbows down, lower fully.',a:['lat_pulldown','db_row']},
lat_pulldown:{n:'Lat pulldown',m:['Back','Biceps'],e:'Cable / lat pulldown',t:'c',u:'kg',i:'Thighs locked under the pad, slight lean back. Pull the bar to the upper chest by driving the elbows down and back, pause, return with control until arms are straight.',a:['assisted_pullup','db_row']},
seated_row:{n:'Seated cable row',m:['Back','Rear delts'],e:'Cable row',t:'c',u:'kg',i:'Chest tall, slight knee bend. Row the handle to your lower ribs, squeeze shoulder blades together, pause, then reach forward under control without rounding.',a:['db_row','machine_row']},
reverse_pec:{n:'Reverse pec deck',m:['Rear delts'],e:'Pec deck machine',t:'i',u:'kg',i:'Chest on the pad, handles at shoulder height, slight bend in the elbows. Sweep the arms back in an arc, pause, return slowly. Keep the shoulders down.',a:['face_pull']},
incline_db_curl:{n:'Incline dumbbell curl',m:['Biceps'],e:'Dumbbells + incline bench',t:'i',u:'hand',i:'Bench at ~45–60°, arms hanging straight down. Curl without letting the elbows drift forward, squeeze at the top, lower fully in 2–3 s.',a:['db_curl','cable_curl']},
cable_hammer:{n:'Cable rope hammer curl',m:['Biceps'],e:'Cable + rope',t:'i',u:'kg',i:'Neutral grip on the rope, elbows pinned to your sides. Curl up, squeeze, lower slowly.',a:['db_hammer','cable_curl']},
cable_lateral:{n:'Cable lateral raise',m:['Shoulders'],e:'Cable (single handle)',t:'i',u:'kg',i:'Cable from low pulley across the body. Raise the arm out to the side to shoulder height leading with the elbow, pause, lower slowly. Light weight, strict form.',a:['db_lateral']},
smith_rdl:{n:'Smith machine Romanian deadlift',m:['Hamstrings','Glutes'],e:'Smith machine',t:'c',u:'kg',i:'Hip-width stance, soft knees. Push the hips back keeping the bar close to your legs and your back flat until you feel a strong hamstring stretch (around mid-shin). Drive hips forward to stand tall.',a:['db_rdl','seated_leg_curl']},
seated_leg_curl:{n:'Seated leg curl',m:['Hamstrings'],e:'Leg curl machine',t:'i',u:'kg',i:'Knees aligned with the pivot, thigh pad snug. Curl the heels down and back, pause, return slowly (3 s).',a:['lying_leg_curl','db_rdl']},
db_reverse_lunge:{n:'Dumbbell reverse lunge',m:['Glutes','Quads'],e:'Dumbbells',t:'c',u:'hand',side:1,i:'Step back into a lunge until the back knee nearly touches the floor, front shin fairly vertical. Push through the front heel to return. Do all reps on one side, then switch.',a:['db_bulgarian','smith_split_squat']},
cable_kickback:{n:'Cable glute kickback',m:['Glutes'],e:'Cable + ankle strap',t:'i',u:'kg',side:1,i:'Ankle strap on, hold the frame, slight hinge. Kick the leg back and slightly out by squeezing the glute — don\'t arch the lower back. Pause, return with control.',a:['banded_kickback','hip_abduction']},
hip_abduction:{n:'Hip abduction machine',m:['Glutes'],e:'Abduction machine',t:'i',u:'kg',i:'Sit tall (or lean slightly forward for more glute). Push the knees out, pause 1 s, return slowly without letting the weight stack touch.',a:['banded_abduction']},
seated_calf:{n:'Seated calf raise',m:['Calves'],e:'Seated calf machine',t:'i',u:'kg',i:'Pad on lower thighs, balls of the feet on the platform. Full stretch at the bottom, rise high, pause.',a:['standing_calf']},
db_shoulder_press:{n:'Dumbbell shoulder press',m:['Shoulders','Triceps'],e:'Dumbbells + upright bench',t:'c',u:'hand',i:'Seated with back supported, dumbbells at ear height, forearms vertical. Press up and slightly in, don\'t clash the dumbbells. Lower to ear height with control.',a:['smith_shoulder_press','machine_press']},
smith_incline:{n:'Smith incline bench press',m:['Chest','Shoulders','Triceps'],e:'Smith machine + incline bench',t:'c',u:'kg',i:'Bench at ~30°, bar touching the upper chest. Shoulder blades pulled back and down, elbows ~45–60° from the body. Lower under control, press up.',a:['db_incline_press','pushup']},
cable_fly:{n:'Cable chest fly',m:['Chest'],e:'Cable crossover',t:'i',u:'kg',i:'Step forward, slight bend in the elbows. Bring the handles together in a hugging arc in front of your chest, squeeze, open slowly to a comfortable stretch.',a:['pec_deck']},
rope_pushdown:{n:'Rope triceps pushdown',m:['Triceps'],e:'Cable + rope',t:'i',u:'kg',i:'Elbows pinned to your sides. Push the rope down and spread the ends at the bottom, squeeze, return until forearms are just above parallel.',a:['overhead_tri']},
overhead_tri:{n:'Overhead cable triceps extension',m:['Triceps'],e:'Cable + rope',t:'i',u:'kg',i:'Face away from the pulley, rope behind the head, elbows pointing forward. Extend the arms overhead, then lower into a deep stretch with control.',a:['rope_pushdown']},
db_hammer:{n:'Dumbbell hammer curl',m:['Biceps'],e:'Dumbbells',t:'i',u:'hand',i:'Neutral (palms-in) grip, elbows at your sides. Curl up without swinging, lower slowly.',a:['cable_hammer']},
dead_bug:{n:'Dead bug',m:['Core'],e:'Mat',t:'i',u:'bw',side:1,i:'On your back, arms up, knees at 90°. Press your lower back into the floor, slowly extend the opposite arm and leg, return, alternate. Breathe out as you extend.',a:['bird_dog','reverse_crunch']},
ball_crunch:{n:'Stability-ball crunch',m:['Core'],e:'Stability ball',t:'i',u:'bw',i:'Ball under the lower/mid back, feet planted. Let the spine extend gently over the ball, then crunch up by bringing the ribs towards the hips. Slow and controlled.',a:['reverse_crunch','dead_bug']},

function exHistory(exId,{excl=null,before=null}={}){
 const out=[];

  if(s.id===excl)continue;if(before&&s.date>=before)continue;
  for(const e of s.exercises){if(e.ex!==exId)continue;
   const sets=e.sets.filter(x=>x.done&&x.r!=null);if(!sets.length)continue;
   const ws=sets.filter(x=>x.w!=null);
   const best=ws.length?ws.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a):sets.reduce((a,b)=>b.r>a.r?b:a);
   out.push({date:s.date,sid:s.id,sets,bestW:best.w,bestR:best.r,e1:Math.max(0,...ws.map(x=>e1rm(x.w,x.r))),vol:sum(ws.map(x=>x.w*x.r)),reps:sum(sets.map(x=>x.r)),equip:e.equip})}}

function sessionPRs(s){

  const top=sets.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.r>a.r))?b:a);
  const e1=Math.max(...sets.map(x=>e1rm(x.w,x.r)));const vol=sum(sets.map(x=>x.w*x.r));
  if(prev.maxW&&top.w>prev.maxW.bestW)prs.push({ex:e.ex,type:'Heaviest load',txt:`${nm}: ${wTxt(top.w,e.ex)} × ${top.r} — heaviest yet`,value:top.w});
  else{const bestAt=Math.max(...sets.filter(x=>x.w===top.w).map(x=>x.r));if(prev.repsAt[top.w]!=null&&bestAt>prev.repsAt[top.w])prs.push({ex:e.ex,type:'Most reps at load',txt:`${nm}: ${bestAt} reps at ${wTxt(top.w,e.ex)} (was ${prev.repsAt[top.w]})`,value:bestAt})}
  if(prev.count>0&&prev.maxE1&&e1>prev.maxE1.e1+0.05)prs.push({ex:e.ex,type:'Best estimated 1RM',txt:`${nm}: est. 1RM ${fmt1(toU(e1))} ${uLbl()} (estimate, not tested)`,value:e1});

function allPRs(){ // timeline of PR events across history

function incFor(ex,w){const e=EX[ex];if(e.u==='hand')return w<10?1:2;return 2.5}
function fatigueFlags(date){
 const f=[];const r=LOG(date).recovery[date];
 if(r){if(r.soreness>=4)f.push('high soreness logged today');if(r.energy&&r.energy<=2)f.push('low energy logged today');if(r.sleepH&&r.sleepH<6)f.push('short sleep last night')}
 const y=addDays(date,-1),fb=(LOG(y).football||[]).find(x=>x.date===y);if(fb&&(fb.rpe>=8||fb.intensity==='High'))f.push('demanding football yesterday');

function suggest(exId,item,date=today()){
 const e=EX[exId];if(!e)return{w:null,why:''};
 if(e.u==='time')return{w:null,action:'Hold',why:`Hold for ${item.lo} s${e.side?' each side':''}. Breathe steadily.`};
 const h=exHistory(exId,{before:null});const last=h[h.length-1];
 if(e.u==='bw'&&!(last&&last.bestW)){return{w:null,action:'Bodyweight',why:last?`Last time: ${last.sets.map(s=>s.r).join(', ')} reps. Aim for one more controlled rep.`:'Bodyweight — slow and controlled.'}}
 if(!last){
  const b=baselineFor(exId).slice(-1)[0];
  if(b){if(b.r<item.lo){const w=Math.max(0,rnd(b.w*(1-0.025*(item.lo-b.r)),incFor(exId,b.w)));return{w,action:'Start here',src:'baseline',why:`Your reported ${b.w} kg × ${b.r} is below the ${item.lo}–${item.hi} rep range, so start around ${toU(w)} ${uLbl()} and build reps.${b.note?' ('+b.note+')':''}`}}
   return{w:b.w,action:'Start here',src:'baseline',why:`From your reported baseline: ${b.w} kg × ${b.r}.${b.note?' ('+b.note+')':''} Phase 1 is about finding working weights — don't chase maximums.`}}
  return{w:null,action:'Find your weight',why:'No history yet — choose a weight you can lift for the target reps with 2–3 reps in reserve, and log it.'}}
 const top=last.bestW;const atTop=last.sets.filter(s=>s.w===top);
 const need=Math.min(item.sets,Math.max(1,atTop.length));const hitAll=atTop.length>=need&&atTop.every(s=>s.r>=item.hi);
 const rirs=atTop.map(s=>s.rir).filter(v=>v!=null&&v!=='');const aRir=rirs.length?avg(rirs.map(Number)):null;
 const minR=Math.min(...atTop.map(s=>s.r));const inc=incFor(exId,top);const ff=fatigueFlags(date);const asst=e.u==='assist';
 const lastTxt=`Last (${fmtShort(last.date)}): ${atTop.map(s=>`${toU(s.w)}×${s.r}`).join(', ')}`;
 let w=top,action,why;
 if(hitAll&&(aRir==null||aRir>=1)){w=asst?Math.max(0,top-inc):top+inc;action=asst?'Reduce assistance':'Increase weight slightly';why=`You hit ${item.hi} reps on all sets at ${toU(top)} ${uLbl()}${aRir!=null?` with ~${fmt1(aRir)} RIR`:''}. ${asst?'Drop':'Add'} ${toU(inc)} ${uLbl()} and aim for ${item.lo}+ reps.`}
 else if(minR<item.lo-1||(minR<item.lo&&aRir===0)){w=asst?top+inc:Math.max(0,rnd(top*0.93,inc));action=asst?'More assistance':'Reduce load';why=`Reps fell below the ${item.lo}–${item.hi} range last time. ${asst?'Add a little assistance':'Drop ~5–10%'} to keep 1–3 reps in reserve.`}
 else{action='Repeat weight, add a rep';why=`Stay at ${toU(top)} ${uLbl()} and try to add a rep or two within ${item.lo}–${item.hi} before increasing.`}
 if(ff.length&&action.startsWith('Increase')){w=top;action='Repeat weight (fatigue)';why=`You'd normally go up, but you logged ${ff.join(' & ')} — repeat ${toU(top)} ${uLbl()}, or drop a set.`}
 else if(ff.length)why+=` Note: ${ff.join(' & ')} — it's fine to drop a set.`;
 return{w,action,why,last:lastTxt,src:'history'}}

function weekRange(mon){return[mon,addDays(mon,6)]}
function sessionsIn(a,b){return doneSessions().filter(s=>s.date>=a&&s.date<=b)}
function logsIn(a,b,field){const out=[];const seen=new Set();for(let m=a.slice(0,7);m<=b.slice(0,7);m=monthKey(addDays(m+'-28',5))){if(seen.has(m))break;seen.add(m);const L=Store.docs['log-'+m];if(!L)continue;

 else for(const x of L[field]||[])if(x.date>=a&&x.date<=b)out.push(x)}

 if((L.home||[]).some(h=>h.date===d))a.push('home');if((L.runs||[]).some(r=>r.date===d&&r.type!=='rest'))a.push('run');if((L.football||[]).some(f=>f.date===d))a.push('football');

 const ss=sessionsIn(a,b),gym=ss.filter(s=>GYM_TPLS.includes(s.tpl)||s.tpl?.startsWith('exam')||!TPL[s.tpl]||TPL[s.tpl].cat!=='home');

 const imp=[];for(const s of ss)for(const e of s.exercises){if(!isLoad(e.ex))continue;const prev=exHistory(e.ex,{before:a});const cur=exHistory(e.ex).filter(x=>x.date>=a&&x.date<=b);if(!prev.length||!cur.length)continue;const p=prev[prev.length-1],c=cur[cur.length-1];
  if(c.bestW>p.bestW)imp.push(`${EX[e.ex].n.toLowerCase()} load (${toU(p.bestW)} → ${toU(c.bestW)} ${uLbl()})`);else if(c.bestW===p.bestW&&c.bestR>p.bestR)imp.push(`${EX[e.ex].n.toLowerCase()} reps (${toU(c.bestW)} ${uLbl()}: ${p.bestR} → ${c.bestR})`)}

function spark(vals,c='var(--lime)',w=90,h=26){if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals)||1;const X=i=>i/(vals.length-1)*(w-4)+2,Y=v=>h-2-(mx===mn?.5:(v-mn)/(mx-mn))*(h-4);return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${vals.map((v,i)=>`${i?'L':'M'}${X(i)},${Y(v)}`).join('')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`}

 h+=`<div class="grid g4 mb"><div class="card kpi"><span class="tiny muted">Workouts in range</span><span class="num">${ss.length}</span></div><div class="card kpi"><span class="tiny muted">Sets this week</span><span class="num">${sum(Object.values(muscleSets(mon,addDays(mon,6))))}</span></div><div class="card kpi"><span class="tiny muted">PRs in range</span><span class="num" style="color:var(--lime)">${prs.length}</span></div><div class="card kpi"><span class="tiny muted">Avg sleep (7 d)</span><span class="num">${rec.length?fmt1(avg(rec.map(r=>+r.sleepH)))+' h':'—'}</span></div></div>

 const k=ui.pEx,X=EX[k]||{n:''},h=exHistory(k).filter(x=>x.date>=a&&x.date<=b),base=baselineFor(k),tg=(P().targets||[]).find(t=>t.ex===k);

 const bands=tg&&metric!=='vol'?[{y0:toU(metric==='e1'?e1rm(tg.wMin,tg.r):tg.wMin),y1:toU(metric==='e1'?e1rm(tg.wMax,tg.r):tg.wMax),c:'var(--cyan)',l:'Dec target zone'}]:[];

 ${h.length?lineChart(series,{h:240,label:X.n+' progression',fmtY:v=>fmt1(v),bands}):`<div class="empty">No logged sessions for ${esc(X.n)} in this range yet.${base.length?` Your reported baseline is ${base.map(x=>x.w+' kg × '+x.r).join(' and ')}.`:''}</div>`}
 <p class="tiny faint mt">Estimated 1RM uses the Epley formula: e1RM = w × (1 + r ⁄ 30), where w is the weight lifted and r is the reps completed. It's an estimate — never a tested maximum.${(X.u==='hand')?' Dumbbell weights are per hand.':''}</p>
 ${bb?`<div class="grid g4 mt"><div class="kpi"><span class="tiny muted">Best load</span><span class="num" style="font-size:20px">${bb.maxW?wTxt(bb.maxW.bestW,k)+' × '+bb.maxW.bestR:'—'}</span></div><div class="kpi"><span class="tiny muted">Best est. 1RM</span><span class="num" style="font-size:20px">${bb.maxE1?.e1?fmt1(toU(bb.maxE1.e1))+' '+uLbl():'—'}</span></div><div class="kpi"><span class="tiny muted">Best session volume</span><span class="num" style="font-size:20px">${bb.maxVol?Math.round(toU(bb.maxVol.vol))+' '+uLbl():'—'}</span></div><div class="kpi"><span class="tiny muted">Sessions</span><span class="num" style="font-size:20px">${bb.count}</span></div></div>`:''}</div>`;
 out+=`<div class="grid g2 mt2"><div class="card"><h2>${ic('flame')}December targets</h2><p class="tiny muted mb">Aspirational, not deadlines. Squat and hip-thrust equipment types are unconfirmed, so early comparisons are approximate.</p><div class="tblw"><table class="t"><thead><tr><th>Exercise</th><th>Start</th><th>Target</th><th>Latest</th></tr></thead><tbody>${(P().targets||[]).map(t=>{const hh=exHistory(t.ex);const l=hh.at(-1);const hit=l&&l.sets.some(s=>s.w>=t.wMin&&s.r>=t.r);return `<tr><td>${esc(EX[t.ex]?.n)}</td><td class="muted">${esc(t.start)}</td><td>${esc(t.label)}</td><td>${l?`${wTxt(l.bestW,t.ex)} × ${l.bestR}${hit?` <span class="chip on">${ic('check')}hit</span>`:''}`:'<span class="faint">—</span>'}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="card"><h2>${ic('trophy')}Personal records</h2>${allPRs().length?`<div class="list">${allPRs().slice(0,14).map(p=>`<div class="li"><span class="chip on">${esc(p.type)}</span><div class="grow small">${esc(p.txt)}</div><span class="tiny faint">${fmtShort(p.date)}</span></div>`).join('')}</div>`:'<div class="empty small">PRs appear automatically once you log sessions that beat your history or reported baseline.</div>'}</div></div>`;
 return out}
function pVolume(a,b){
 const weeks=[];for(let m=mondayOf(a);m<=b;m=addDays(m,7))weeks.push(m);
 const wk=weeks.slice(-12).map(m=>{const ss=sessionsIn(m,addDays(m,6));return{l:fmtShort(m),v:Math.round(toU(sum(ss.map(sessVolume)))),tip:`Week of ${fmtShort(m)}: ${ss.length} sessions`}});

 for(let d=0;d<7;d++){heat+=`<span>${DS[d].slice(0,2)}</span>`;for(let w=0;w<nW;w++){const day=addDays(start,w*7+d);const act=day<=today()?activityOn(day):[];const c=act.includes('gym')?'var(--lime)':act.includes('football')?'var(--cyan)':act.length?'var(--blue)':'';heat+=`<i title="${fmtD(day)}: ${act.join(', ')||'—'}" style="${c?`background:${c};border-color:${c};opacity:${.55+.15*act.length}`:''}"></i>`}}

 <div class="card"><h2>${ic('cal')}Consistency</h2>${heat}<div class="legend"><span><i style="background:var(--lime)"></i>Gym</span><span><i style="background:var(--cyan)"></i>Football</span><span><i style="background:var(--blue)"></i>Run / home</span></div></div>

 const ideas=[];if((cnt['rice']||0)>=2)ideas.push(`Cook a big batch of rice — it's in ${cnt['rice']} meals this week. Cool quickly and refrigerate; use within a day or two.`);

V.recovery=()=>{
 const t=today();ui.rDate=ui.rDate||t;const d=ui.rDate;const L=LOG(d);const r=L.recovery[d]||{};ui.rc=ui.rc&&ui.rc._d===d?ui.rc:{...clone(r),_d:d};const c=ui.rc;
 const rd=readiness(c);const sym=symptomDays(30);const hide=ST().hideHealth;
 const yfb=(LOG(addDays(t,-1)).football||[]).some(f=>f.date===addDays(t,-1));
 const tips=[];if(yfb)tips.push('Football yesterday: easy walk or the 8-minute mobility routine, and an extra carb-rich snack.');
 if((r.soreness||0)>=4)tips.push('High soreness: keep today light — mobility, a walk, or keep loads the same and drop a set.');
 if(r.sleepH&&r.sleepH<7)tips.push('Short sleep: prioritise an earlier night; skip optional finishers today.');
 tips.push('Rest days still need full meals — recovery is when muscle is actually built.','Gentle options: 20–30 min walk, mobility routine, stretching, or simply resting.');
 const wk=[];for(let i=6;i>=0;i--){const day=addDays(t,-i);wk.push({l:DS[dow(day)],v:hydrationTotal(day)/1000,c:'var(--cyan)'})}
 const r14=logsIn(addDays(t,-13),t,'recovery');
 return `<div class="top"><div><div class="eyebrow">Recovery</div><h1>Am I recovering properly?</h1></div><div class="row"><button class="btn icon" data-a="rNav" data-n="-1" aria-label="Previous day">${ic('l')}</button><input type="date" value="${d}" data-c="rDate" style="width:160px"><button class="btn icon" data-a="rNav" data-n="1" aria-label="Next day" ${d>=t?'disabled':''}>${ic('r')}</button></div></div>
 <div class="grid today-grid"><div class="card"><div class="hd"><h2>${ic('moon')}Daily check-in · ${fmtD(d)}</h2>${L.recovery[d]?'<span class="chip on">saved</span>':''}</div>
 <div class="fgrid"><label class="f">Sleep duration (h)<input inputmode="decimal" id="rcSleep" value="${c.sleepH??''}" placeholder="e.g. 7.5"></label></div>
 ${[['sleepQ','Sleep quality','1 poor – 5 great'],['energy','Energy','1 low – 5 high'],['soreness','Muscle soreness','1 none – 5 very sore'],['stress','Stress','1 calm – 5 very stressed'],['mood','Mood','1 low – 5 great'],['motivation','Motivation','1 low – 5 high'],['recovery','Perceived recovery','1 not recovered – 5 fully']].map(([f,l,s])=>`<div class="mt"><div class="row between"><span class="small b">${l}</span><span class="tiny faint">${s}</span></div><div style="margin-top:6px">${rateRow(f,c[f],'data-rc="1"')}</div></div>`).join('')}
 <div class="grid g2 mt2 ${hide?'blur':''}"><div class="card el hx" style="padding:12px"><label class="row small b"><input type="checkbox" id="rcA" ${c.asthma?.on?'checked':''}>Asthma symptoms</label><input class="mt" id="rcAN" placeholder="Details (optional)" value="${esc(c.asthma?.note||'')}"></div><div class="card el hx" style="padding:12px"><label class="row small b"><input type="checkbox" id="rcC" ${c.cold?.on?'checked':''}>Cold-related symptoms</label><input class="mt" id="rcCN" placeholder="e.g. purple patches on fingers after walking" value="${esc(c.cold?.note||'')}"></div></div>
 <label class="f mt">Notes<textarea id="rcN">${esc(c.notes||'')}</textarea></label>
 <div class="row mt2"><button class="btn pri" data-a="saveRecovery">${ic('check')}Save check-in</button>${L.recovery[d]?`<button class="btn ghost danger" data-a="delRecovery">${ic('trash')}Clear</button>`:''}</div></div>
 <div class="col" style="gap:16px"><div class="card"><h2>${ic('heart')}Self-rated readiness</h2>${rd!=null?`<div class="row" style="gap:16px">${ring(rd/100,96,9,'var(--violet)',`<b class="num" style="font-size:22px">${rd}</b>`)}<p class="small muted">A simple average of your own 1–5 ratings (soreness and stress inverted). It's a subjective self-reported estimate, not a physiological recovery score.</p></div>`:'<div class="empty small">Rate at least three items to see this.</div>'}</div>
 ${(sym.cold.size>=2||sym.asthma.size>=3||sym.hr.size)?`<div class="note warn ${hide?'blur':''}">${ic('alert')}<div class="small hx">In the last 30 days you logged ${[sym.cold.size?`cold-related symptoms on ${sym.cold.size} day(s)`:'',sym.asthma.size?`asthma symptoms on ${sym.asthma.size} day(s)`:'',sym.hr.size?`high heart rates on ${sym.hr.size} day(s)`:''].filter(Boolean).join(', ')}. That pattern is worth sharing with a doctor — you can export the log from Settings. FORMA doesn't diagnose anything.</div></div>`:''}
 <div class="card"><h2>${ic('info')}Rest-day suggestions</h2><ul class="small" style="padding-left:18px;line-height:1.7">${tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn sm" data-a="startHome" data-tpl="mobility">${ic('play')}8-min mobility</button></div>
 <div class="card"><h2>${ic('drop')}Hydration · last 7 days</h2>${barChart(wk,{h:150,label:'Hydration',band:[ST().waterMin/1000,ST().waterMax/1000],fmtY:v=>fmt1(v)})}<p class="tiny faint">Litres per day. Shaded: your flexible range.</p></div></div></div>
 <div class="card mt2"><h2>${ic('chart')}Last 14 days</h2>${lineChart([{name:'Energy',c:'var(--lime)',points:r14.filter(x=>x.energy).map(x=>({d:x.date,y:x.energy}))},{name:'Soreness',c:'var(--rose)',points:r14.filter(x=>x.soreness).map(x=>({d:x.date,y:x.soreness}))},{name:'Mood',c:'var(--cyan)',points:r14.filter(x=>x.mood).map(x=>({d:x.date,y:x.mood}))}],{h:200,yMin:.5,yMax:5.5,fmtY:v=>Math.round(v),label:'Recovery trend'})}
 <div class="list mt">${r14.filter(x=>x.notes).reverse().slice(0,5).map(x=>`<div class="li small"><b>${fmtShort(x.date)}</b><span class="muted grow">${esc(x.notes)}</span></div>`).join('')}</div></div>`};

 <div class="li"><span class="grow small b">Fluid range (mL)</span><input inputmode="numeric" style="width:80px" data-c="water" data-k="waterMin" value="${s.waterMin}"> – <input inputmode="numeric" style="width:80px" data-c="water" data-k="waterMax" value="${s.waterMax}"></div></div>
 <div class="card"><h2>${ic('info')}In-app reminders</h2>${tog('remind.workout','Workout starting soon')}${tog('remind.water','Gentle hydration nudge (afternoon)')}${tog('remind.checkin','Recovery check-in')}<p class="tiny faint mt">Reminders appear on the Today page while FORMA is open. Exam Mode hides the optional ones. Browser push notifications aren't available inside this page.</p></div>
 <div class="card"><h2>${ic('flame')}Strength baseline & targets</h2><div class="tblw"><table class="t"><thead><tr><th>Baseline</th><th>kg</th><th>Reps</th></tr></thead><tbody>${p.baseline.map((b,i)=>`<tr><td class="small">${esc(EX[b.ex]?.n)}<div class="tiny faint">${esc(b.note||'')}</div></td><td><input inputmode="decimal" value="${b.w}" data-i="base" data-n="${i}" data-f="w" style="width:70px"></td><td><input inputmode="numeric" value="${b.r}" data-i="base" data-n="${i}" data-f="r" style="width:60px"></td></tr>`).join('')}</tbody></table></div>
 <div class="tblw mt"><table class="t"><thead><tr><th>Target</th><th>Min kg</th><th>Max kg</th><th>Reps</th></tr></thead><tbody>${p.targets.map((t,i)=>`<tr><td class="small">${esc(EX[t.ex]?.n)}</td><td><input inputmode="decimal" value="${t.wMin}" data-i="target" data-n="${i}" data-f="wMin" style="width:64px"></td><td><input inputmode="decimal" value="${t.wMax}" data-i="target" data-n="${i}" data-f="wMax" style="width:64px"></td><td><input inputmode="numeric" value="${t.r}" data-i="target" data-n="${i}" data-f="r" style="width:54px"></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h2>${ic('dl')}Your data</h2><p class="small muted mb">Export everything or one type at a time. ${Store.sb?'Your data syncs to your own FORMA account — only you can read it.':Store.mode==='cloud'?'Your data lives in your own private space on this page — people you share the page with can\'t read it.':'Cloud storage isn\'t set up here, so data is kept in this browser. Export a backup now and then.'}</p>
 <div class="row wrap"><button class="btn" data-a="export" data-k="json">${ic('dl')}All data (JSON)</button>${[['workouts','Workouts'],['strength','Strength sets'],['hydration','Hydration'],['recovery','Recovery'],['schedule','Schedule'],['prs','Personal records'],['runs','Runs & football']].map(([k,l])=>`<button class="btn sm" data-a="export" data-k="${k}">${l} CSV</button>`).join('')}</div>
 <div class="row wrap mt2"><label class="btn sm">${ic('undo')}Import JSON backup<input type="file" accept=".json,application/json" data-c="import" class="sr"></label>${Store.sb?'<button class="btn sm" data-a="signOut">Sign out</button>':''}<button class="btn sm ghost danger" data-a="resetAll">${ic('trash')}Reset all data</button></div>
 <p class="tiny faint mt">WHOOP and Google Calendar aren't connected — manual entry works fully, and the .ics export adds your plan to any calendar.</p></div></div>`};

/* ============ export ============ */
const csv=rows=>rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
function allLogs(field){return logsIn('2000-01-01','2100-12-31',field)}
function exportData(k){let name,data,type='text/csv';
 if(k==='json'){name=`forma-backup-${today()}.json`;data=JSON.stringify({app:'FORMA',version:1,exported:new Date().toISOString(),docs:Store.docs},null,1);type='application/json'}
 else if(k==='workouts'){name='forma-workouts.csv';data=csv([['date','workout','start','duration_min','sets_done','volume_kg','notes'],...doneSessions().map(s=>[s.date,s.name,s.start,Math.round((s.elapsed||0)/60000),s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0),Math.round(sessVolume(s)),s.notes])])}
 else if(k==='strength'){name='forma-strength-sets.csv';const r=[['date','workout','exercise','equipment','set','weight_kg','per_hand','reps','rir','rpe','rest_sec','completed','notes']];for(const s of doneSessions())for(const e of s.exercises)e.sets.forEach((x,i)=>r.push([s.date,s.name,EX[e.ex]?.n,e.equip,i+1,x.w,EX[e.ex]?.u==='hand'?'yes':'',x.r,x.rir,x.rpe,e.rest,x.done?'yes':'no',e.note]));data=csv(r)}
 else if(k==='hydration'){name='forma-hydration.csv';data=csv([['date','time','amount_ml'],...allLogs('hydration').map(h=>[h.date,h.time,h.ml])])}
 else if(k==='recovery'){name='forma-recovery.csv';data=csv([['date','sleep_h','sleep_quality','energy','soreness','stress','mood','motivation','recovery','asthma','asthma_note','cold','cold_note','notes'],...allLogs('recovery').map(r=>[r.date,r.sleepH,r.sleepQ,r.energy,r.soreness,r.stress,r.mood,r.motivation,r.recovery,r.asthma?.on?'yes':'',r.asthma?.note,r.cold?.on?'yes':'',r.cold?.note,r.notes])])}
 else if(k==='schedule'){name='forma-schedule.csv';const o=occurrences(addDays(today(),-28),addDays(today(),56));data=csv([['date','start','end','title','category','status'],...o.map(x=>[x.date,x.start,x.end,x.cat==='meal'?mealName(x.mealId):x.title,x.cat,x.status||'planned'])])}
 else if(k==='prs'){name='forma-personal-records.csv';data=csv([['date','exercise','record_type','detail'],...allPRs().map(p=>[p.date,EX[p.ex]?.n,p.type,p.txt])])}
 else if(k==='runs'){name='forma-runs-football.csv';data=csv([['type','date','kind','duration_min','distance_km','avg_hr','max_hr','rpe','intensity','weather','temp_c','cold_symptoms','asthma_symptoms','notes'],...allLogs('runs').map(r=>['run',r.date,r.type,r.dur,r.dist,r.avgHr,r.maxHr,r.rpe,'',r.weather,r.temp,r.cold?.on?'yes':'',r.asthma?.on?'yes':'',r.notes]),...allLogs('football').map(f=>['football',f.date,f.kind,f.dur,'','','',f.rpe,f.intensity,'','','','',f.notes])])}
 deliver(name,data,type)}
async function deliver(name,data,type){
 if(!window.claude){try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Downloaded '+name);return}catch(e){}}
 try{const dl=window.claude?await withTO(window.claude.use('downloads'),4000):null;if(dl&&dl!=='__to'){await dl.save({filename:name,data:new Blob([data],{type})});toast('Saved '+name);return}}catch(e){if(e&&/declin|cancel|abort/i.test(e.message||e.code||''))return}
 modal(`${mh('Export: '+esc(name),'Direct downloads aren\'t available in this view — copy the data and paste it into a file.')}<textarea id="expTx" style="min-height:260px;font-family:monospace;font-size:12px" readonly>${esc(data)}</textarea><div class="row mt"><button class="btn pri" data-a="copyExp">${ic('copy')}Copy to clipboard</button></div>`)}
function icsData(){const a=addDays(today(),-7),b=addDays(today(),70);const o=occurrences(a,b,{meals:false}).filter(x=>x.status!=='skipped');const st=d=>d.replace(/-/g,'');const tm=t=>t.replace(':','')+'00';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FORMA//EN','CALSCALE:GREGORIAN','BEGIN:VTIMEZONE','TZID:Europe/Paris','BEGIN:STANDARD','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','END:STANDARD','BEGIN:DAYLIGHT','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','END:DAYLIGHT','END:VTIMEZONE'];
 const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 for(const x of o){L.push('BEGIN:VEVENT',`UID:${x.key.replace(/[^A-Za-z0-9@.-]/g,'')}@forma`,`DTSTAMP:${stamp}`);if(x.allDay)L.push(`DTSTART;VALUE=DATE:${st(x.date)}`,`DTEND;VALUE=DATE:${st(addDays(x.date,1))}`);else L.push(`DTSTART;TZID=Europe/Paris:${st(x.date)}T${tm(x.start)}`,`DTEND;TZID=Europe/Paris:${st(x.date)}T${tm(x.end)}`);L.push(`SUMMARY:${(x.title||'').replace(/[,;]/g,'\\$&')}`,`CATEGORIES:${CAT[x.cat]?.l||x.cat}`,'END:VEVENT')}
 L.push('END:VCALENDAR');return L.join('\r\n')}

const THEMES=[['sage','Sage & Ocean','#F7F1E4',['#7FA383','#3F8FA6','#5E8FA8','#C08A2E']],['dusk','Dusk','#171A23',['#9BE3B4','#B7A9F7','#86C9F0','#F2C27E']],['rose','Rose','#1D1620',['#F5A9C4','#C9B3F5','#F6C6A4','#FF8FA8']],['ocean','Ocean','#0F1E26',['#6FE0CF','#9DB4FF','#7CCFF5','#F5CF88']],['midnight','Midnight','#151D30',['#B6F36A','#8B7CF6','#48C9D8','#F28FAD']],['light','Light','#F6F4F1',['#3E9B6E','#7A63D8','#2C8DB8','#CC4F70']]];
const curTheme=()=>{const s=ST();return s.themeChosen&&s.theme?s.theme:'sage'};

/* ============ actions ============ */
const S_=id=>Store.docs['ws-'+id];
const T_=()=>today();
function applyTheme(){document.documentElement.dataset.theme=curTheme()}
function occStatusFor(date,cat,key){if(key){const o=findOcc(key,date);if(o)return o}return occurrences(date,date,{meals:false}).find(o=>o.cat===cat)}
function moveLogItem(field,oldDate,item){const L0=LOG(oldDate);L0[field]=L0[field].filter(x=>x.id!==item.id);save('log-'+monthKey(oldDate));const L1=LOG(item.date);L1[field].push(item);save('log-'+monthKey(item.date))}
const A={
 go:t=>{closeModal();ui.logger=ui.logger&&t.dataset.v==='workouts'?ui.logger:null;if(location.hash==='#'+t.dataset.v)render();else location.hash=t.dataset.v},
 moreMenu:(t,e)=>{e.preventDefault();modal(`${mh('More')}<div class="list">${[['recovery','Recovery','moon'],['study','Calendar & Study','book'],['prefs','Settings & data','sliders']].map(([k,l,i])=>`<a class="li" href="#${k}" data-a="go" data-v="${k}" style="text-decoration:none;color:var(--text)">${ic(i)}<span class="grow b">${l}</span>${ic('r')}</a>`).join('')}</div>`)},
 close:()=>closeModal(),
 scrim:(t,e)=>{if(e.target===t)closeModal()},
 undo:()=>{const u=_toast&&_toast.undo;_toast=null;renderDock();u&&u()},
 restAdd:()=>{RT.end+=15000;RT.total+=15;RT.fired=false},
 restSkip:()=>{RT.end=0;renderDock()},
 restStart:t=>startRest(+t.dataset.sec,t.dataset.l),
 examToggle:()=>{const s=ST();s.examMode=!s.examMode;save('settings');render();toast(s.examMode?'Exam Mode on — shorter sessions recommended':'Exam Mode off')},
 startWorkout:t=>startWorkout(t.dataset.tpl,t.dataset.key),
 startHome:t=>startHome(t.dataset.tpl,t.dataset.key),
 openLogger:t=>openLogger(t.dataset.id),
 tplDetail:t=>tplDetail(t.dataset.tpl),
 occ:t=>openOcc(t.dataset.key,t.dataset.d),
 occDone:t=>{const o=findOcc(t.dataset.key,t.dataset.d);if(!o)return;
  if(o.cat==='meal'){const L=LOG(o.date);L.meals[o.date]=L.meals[o.date]||{};L.meals[o.date][o.slot]=L.meals[o.date][o.slot]?undefined:Date.now();if(!L.meals[o.date][o.slot])delete L.meals[o.date][o.slot];save('log-'+monthKey(o.date))}
  else{setOccStatus(o,o.status==='done'?null:'done');save('schedule')}
  closeModal();render()},
 skipOcc:t=>{const o=findOcc(t.dataset.key,t.dataset.d);if(!o)return;closeModal();undoable(`Skipped ${o.title}`,['schedule'],()=>setOccStatus(o,'skipped'))},
 unskipOcc:t=>{const o=findOcc(t.dataset.key,t.dataset.d);if(!o)return;closeModal();undoable(`Restored ${o.title}`,['schedule'],()=>setOccStatus(o,null))},
 delOcc:t=>{const o=findOcc(t.dataset.key,t.dataset.d);if(!o)return;closeModal();undoable(`Removed ${o.title} on ${fmtD(o.date)}`,['schedule'],()=>setOverride(o.key,{deleted:1}))},
 mvQuick:t=>{const i=$('#mvD');i.value=addDays(i.value,+t.dataset.n)},
 mvSave:t=>{const o=findOcc(t.dataset.key,t.dataset.d);if(!o)return;const d=$('#mvD').value,s=$('#mvS').value,e=$('#mvE').value;if(!d||!s){toast('Pick a date and time');return}if(e&&hm2m(e)<=hm2m(s)){toast('End must be after start');return}
  closeModal();undoable(`Moved ${o.title} to ${fmtD(d)} ${s}`,['schedule'],()=>{if(o.oneoff){Object.assign(SCH().oneoff.find(x=>x.id===o.key),{date:d,start:s,end:e||m2hm(hm2m(s)+60)})}else setOverride(o.key,{date:d,start:s,end:e||m2hm(hm2m(s)+hm2m(o.end)-hm2m(o.start))})})},
 addEvent:t=>{modal(`${mh('Add event')}${eventForm({date:t.dataset.d||T_(),cat:t.dataset.cat||'personal'})}<div class="row mt2" style="justify-content:flex-end"><button class="btn pri" data-a="saveEvent" data-mode="new">${ic('check')}Add</button></div>`)},
 addExam:()=>{modal(`${mh('Add exam')}${eventForm({cat:'exam',start:'10:00',end:'12:00',date:T_()})}<div class="row mt2" style="justify-content:flex-end"><button class="btn pri" data-a="saveEvent" data-mode="new">${ic('check')}Add exam</button></div>`)},
 addRecurring:()=>{modal(`${mh('Add recurring event','Repeats every week — e.g. a class or regular study block.')}${eventForm({cat:'class',dow:0,start:'08:30',end:'11:30',from:T_()},true)}<div class="row mt2" style="justify-content:flex-end"><button class="btn pri" data-a="saveEvent" data-mode="newrec">${ic('check')}Add</button></div>`)},
 editRecurring:t=>{const r=SCH().recurring.find(x=>x.id===t.dataset.rid);if(!r)return;modal(`${mh('Edit weekly event','Changes apply to every week from the start date. Individual moves stay as they are.')}${eventForm(r,true)}<div class="row mt2" style="justify-content:space-between"><button class="btn ghost danger" data-a="delRecurring" data-rid="${r.id}">${ic('trash')}Delete series</button><button class="btn pri" data-a="saveEvent" data-mode="rec" data-id="${r.id}">${ic('check')}Save</button></div>`)},
 delRecurring:t=>{const id=t.dataset.rid;closeModal();undoable('Deleted weekly event',['schedule'],()=>{const s=SCH();s.recurring=s.recurring.filter(x=>x.id!==id)})},
 editOneoff:t=>{const e=SCH().oneoff.find(x=>x.id===t.dataset.id);if(!e)return;modal(`${mh('Edit event')}${eventForm(e)}<div class="row mt2" style="justify-content:space-between"><button class="btn ghost danger" data-a="delOneoff" data-id="${e.id}">${ic('trash')}Delete</button><button class="btn pri" data-a="saveEvent" data-mode="oneoff" data-id="${e.id}">${ic('check')}Save</button></div>`)},
 delOneoff:t=>{const id=t.dataset.id;closeModal();undoable('Event deleted',['schedule'],()=>{const s=SCH();s.oneoff=s.oneoff.filter(x=>x.id!==id)})},
 saveEvent:t=>{const m=t.dataset.mode,rec=m==='rec'||m==='newrec';const o=readEventForm(rec);if(!o)return;const s=SCH();
  if(m==='new')s.oneoff.push({id:'o-'+uid(),...o});

  else if(m==='rec')Object.assign(s.recurring.find(x=>x.id===t.dataset.id),o);
  save('schedule');closeModal();render();toast('Saved')},
 wkMode:t=>{ui.wkMode=t.dataset.m;if(ui.wkMode==='day'&&(ui.day<ui.week||ui.day>addDays(ui.week,6)))ui.day=ui.week;render()},

 waterCustom:t=>{const d=t.dataset.d;modal(`${mh('Add drink')}<div class="fgrid"><label class="f">Amount (mL)<input id="wcMl" inputmode="numeric" autofocus placeholder="e.g. 330"></label><label class="f">Time<input type="time" id="wcT" value="${nowHM()}"></label></div><div class="row mt2" style="justify-content:flex-end"><button class="btn pri" data-a="waterCustomSave" data-d="${d}">${ic('plus')}Add</button></div>`)},

 studyCfg:t=>{const v=num(t.value);if(!v||v<1||v>180)return;ST().study[t.dataset.f]=v;save('settings')},
 setting:t=>{const path=t.dataset.k.split('.');let o=ST();while(path.length>1)o=o[path.shift()];o[path[0]]=t.checked;save('settings');render()},
 water:t=>{const v=num(t.value),s=ST();if(!v||v<500||v>6000){toast('Use a value between 500 and 6000 mL');return}s[t.dataset.k]=v;if(s.waterMin>s.waterMax)[s.waterMin,s.waterMax]=[s.waterMax,s.waterMin];save('settings')},
 import:t=>{const f=t.files&&t.files[0];if(!f)return;f.text().then(txt=>{let j;try{j=JSON.parse(txt)}catch(e){toast('That file isn\'t valid JSON');return}if(!j||!j.docs||!j.docs.profile){toast('This doesn\'t look like a FORMA backup');return}
  confirmBox('Import backup?',`This replaces your current data with the backup from ${esc((j.exported||'').slice(0,10))}.`,'Import',()=>{for(const k of Object.keys(Store.docs))if(!j.docs[k])delDoc(k);for(const[k,v]of Object.entries(j.docs)){Store.docs[k]=v;Store.del.delete(k);save(k)}applyTheme();render();toast('Backup imported')},false)})}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const fn=A[t.dataset.a];if(!fn)return;if(t.tagName==='A'&&t.dataset.a!=='moreMenu'&&t.dataset.a!=='go')e.preventDefault();if(t.dataset.a==='go'&&t.tagName==='A')e.preventDefault();try{fn(t,e)}catch(err){console.error(err);toast('Something went wrong: '+err.message)}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t&&I[t.dataset.i])I[t.dataset.i](t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(t&&C[t.dataset.c])C[t.dataset.c](t)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target;if(t.matches('.blk')){e.preventDefault();openOcc(t.dataset.key,t.dataset.d)}else if(t.matches('[role=button][data-a]')&&t.tagName!=='BUTTON'){e.preventDefault();t.click()}});
ui.view=(VIEWS.some(v=>v[0]===location.hash.slice(1))?location.hash.slice(1):'today');
boot();
</script>
</body></html>
